# Migrated from tmux (.config/tmux/tmux.conf)
# ~/.config/herdr holds runtime state (sockets, logs), so link.sh links
# only this file instead of the directory.

onboarding = false

[theme]
# status bar used catppuccin mocha colors
name = "catppuccin"

[keys]
prefix = "ctrl+q"

# splits follow tmux: s = side by side, v = stacked
split_vertical = "prefix+s"
split_horizontal = "prefix+v"
# split_vertical takes prefix+s, so move settings off of it
settings = "prefix+comma"

# tmux: H/J/K/L
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# tmux: Tab = switch-client -l (back-and-forth across workspaces)
last_pane = "prefix+tab"
cycle_pane_next = ""

# tmux: t = tw-pick window picker → hw-pick popup below
# (workspace_picker stays on the default prefix+w)

# fuzzy tab picker across all workspaces (bin/hw-pick)
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "~/.dotfiles/bin/hw-pick"
width = "90%"
height = "80%"

# claude session manager: browse/resume/close claude sessions across
# profiles (~/box/restore_sessions)
[[keys.command]]
key = "prefix+e"
type = "popup"
command = "~/.local/bin/csm"
width = "90%"
height = "80%"

# tmux: C-h/C-j/C-k/C-l = resize-pane by 5 cells. herdr resizes by a split
# ratio delta instead, and its default step (0.05) is the closest equivalent,
# so no --amount. Without HERDR_PANE_ID in the environment — which is the case
# for a keybinding — `--current` resolves to the focused pane.
[[keys.command]]
key = "prefix+ctrl+h"
type = "shell"
command = "~/.local/bin/herdr pane resize --direction left --current"

[[keys.command]]
key = "prefix+ctrl+j"
type = "shell"
command = "~/.local/bin/herdr pane resize --direction down --current"

[[keys.command]]
key = "prefix+ctrl+k"
type = "shell"
command = "~/.local/bin/herdr pane resize --direction up --current"

[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "~/.local/bin/herdr pane resize --direction right --current"

# tmux: C-n = split-window -h -p 32, where 32% went to the *new* pane. herdr's
# --ratio is the share kept by the pane being split, hence 0.68. cwd is
# inherited, so unlike tmux there is nothing to pass through.
[[keys.command]]
key = "prefix+ctrl+n"
type = "shell"
command = "~/.local/bin/herdr pane split --current --direction right --ratio 0.68 --focus"

# tmux had four select-layout presets; only their ratios survive the move to
# herdr (bin/hw-layout explains why), so they collapse into one balance. C-t
# was tmux's direction-agnostic "even everything out" key, which is what this
# is.
[[keys.command]]
key = "prefix+ctrl+t"
type = "shell"
command = "~/.dotfiles/bin/hw-layout balance"

[advanced]
# tmux: history-limit 240000 lines (~100 bytes/line)
scrollback_limit_bytes = 24000000

[ui]
show_agent_labels_on_pane_borders = true
# collapse (prefix+b) removes the sidebar entirely instead of leaving a rail
sidebar_collapsed_mode = "hidden"
# tab-centric workflow: agents as one attention queue, not grouped by workspace
agent_panel_sort = "priority"

[ui.toast]
delivery = "system"

# agent rows without the workspace column (tabs are the task unit)
[ui.sidebar.agents]
rows = [["state_icon", "tab"], ["agent"]]

# requires the patched build (scripts/herdr-patches): hide the spaces
# section entirely — workspace switching is unused, only the agent queue
# matters. The stock binary ignores the unknown key, so this is safe to
# keep either way.
[ui.sidebar.spaces]
hidden = true
